name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: 저장소 정책 및 문서 검증
        run: python3 scripts/verify_repository.py
      - name: Python 테스트
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'

  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: trading_test
          POSTGRES_USER: trading_ci
          POSTGRES_PASSWORD: trading_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_ci -d trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/trading_test
      TEST_POSTGRES_USER: trading_ci
      TEST_POSTGRES_PASSWORD: trading_ci_password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Java 빌드 및 테스트
        run: mvn --batch-mode --no-transfer-progress verify
